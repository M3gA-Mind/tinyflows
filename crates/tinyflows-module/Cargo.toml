[package]
name = "tinyflows-module"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Loadable TinyBus module for workflow authoring"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyflows-schedule = { path = "../tinyflows-schedule" }
anyhow = "1"
chrono.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tinyflows.workspace = true
tinyflows-bus = { path = "../tinyflows-bus" }
tinybus = { version = "=0.1.3", default-features = false, features = ["macros", "modules"] }
tinybus-module = "=0.1.3"
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
