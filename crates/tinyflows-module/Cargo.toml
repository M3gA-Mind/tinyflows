[package]
name = "tinyflows-module"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
publish = false
description = "Loadable TinyBus module for workflow authoring and scheduling"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyflows-drivers = { path = "../tinyflows-drivers", default-features = false, features = ["schedule"] }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v0.11.0" }
tinyflows-schedule = { path = "../tinyflows-schedule" }
anyhow = "1"
chrono.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tinyflows = { workspace = true, features = ["mock"] }
tinyflows-bus = { path = "../tinyflows-bus" }
tinybus = { version = ">=0.1.3, <0.2", default-features = false, features = ["macros", "modules"] }
tinybus-module = ">=0.1.3, <0.2"
serde_json.workspace = true

[features]
default = []
# Swap the C ABI exports for a Rust `linked_module()` so a host can link the
# module into its own executable (several linked modules can then coexist).
static-link = []

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
