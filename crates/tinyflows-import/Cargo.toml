# Reads the stores tinyflows hosts used before storage moved to the
# `tinystoragedrivers` ports, and writes what they held into the port-backed
# stores (`tinyflows-drivers`), id for id and only where nothing exists yet.
#
# A crate of its own, and not published: it names the storage crates by git tag
# (as `tinyflows-drivers` does), and it is the one place that still knows the
# retired formats (`flows.db`, `jobs.db`, `checkpoints.db`, the JSON/JSONL
# stores). The SQLite files are read through the SQLite driver's native handle,
# never a database client of this crate's own.
[package]
name = "tinyflows-import"
version = "0.1.0"
description = "One-time, read-only import of legacy tinyflows stores into the storage-port stores"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# Every importer by default. A host builds with `default-features = false` and
# only the importers it ships: a build that runs scheduled jobs but no flows
# takes `schedule` alone and pulls neither the engine nor its expression stack.
default = ["engine", "store", "catalog", "schedule", "checkpoint-read"]
# `import_sqlite_checkpoints`, `import_file_checkpoints`.
engine = ["dep:tinyflows", "dep:tinyflows-drivers", "tinyflows-drivers/engine"]
# `import_workflow_store`.
store = ["engine", "tinyflows/store", "tinyflows-drivers/store"]
# `import_flow_catalog`, `import_file_state`.
catalog = ["flow-write", "flow-read", "dep:tinyflows-catalog", "dep:tinyflows-drivers", "tinyflows-drivers/catalog"]
# `import_cron`.
schedule = ["schedule-read", "dep:tinyflows-schedule", "dep:tinyflows-drivers", "tinyflows-drivers/schedule"]
# `read_legacy_cron`: decodes `jobs.db` into bus records only, for a host that
# replays them through the scheduler module. Links neither the scheduler
# implementation nor the cron store.
# `read_legacy_cron`: decodes `jobs.db` into bus records only, for a host that
# replays them through the scheduler module. Links neither implementation crate.
schedule-read = ["dep:tinyflows-bus", "dep:tinystoragedrivers-sqlite"]
# Host-side legacy flow/checkpoint records without linking flow implementation
# crates. The catalog module owns applying these records through scoped ports.
flow-read = ["dep:tinyflows-bus", "dep:tinystoragedrivers-sqlite"]
# Shared semantic importer used by both the legacy public API and Catalog bus.
flow-write = ["engine", "dep:tinyflows-bus", "dep:tinyflows-catalog", "tinyflows-drivers/catalog"]
# Host-side checkpoint source reader; kept separate from the engine writer.
checkpoint-read = ["flow-read"]

[dependencies]
tinyflows = { workspace = true, optional = true }
tinyflows-catalog = { version = "0.1.0", path = "../tinyflows-catalog", optional = true }
tinyflows-bus = { path = "../tinyflows-bus", optional = true }
tinyflows-schedule = { version = "0.1.0", path = "../tinyflows-schedule", optional = true }
tinyflows-drivers = { path = "../tinyflows-drivers", default-features = false, optional = true }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "be94f7568fe7650b0729be55128f48270414b9a7" }
# The SQLite driver's native handle: how the legacy `.db` files are opened. It
# re-exports the `rusqlite` its handle hands out, which is all this crate uses.
tinystoragedrivers-sqlite = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "be94f7568fe7650b0729be55128f48270414b9a7", optional = true }
anyhow = "1.0"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
tempfile = "3"
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
