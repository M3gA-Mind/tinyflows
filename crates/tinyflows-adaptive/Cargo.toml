[package]
name = "tinyflows-adaptive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "An adaptive loop over the tinyflows engine: select or author a workflow, run it, judge it, learn."
# Names `tinystoragedrivers-core` by git tag, which crates.io cannot resolve
# (docs/storage-crate-split.md); never published.
publish = false

[dependencies]
tinyflows = { path = "../tinyflows", features = ["store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
# `storage-drivers` only: the storage ports (no database client), named by git
# tag so a host that vendors tinystoragedrivers once can `[patch]` it; SHA-256
# for over-long document ids; tokio's `OnceCell` for one-time collection setup.
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v0.7.0", optional = true }
sha2 = { version = "0.11", optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

[features]
# No feature opens a database: the crate keeps no storage of its own. The
# ledger and vault are in memory by default, and durable on the host's
# `tinystoragedrivers` backend with `storage-drivers`.
default = []
# The ledger and vault on a `tinystoragedrivers` document port
# (`Storage::from_documents`), so the host's storage backend (SQLite, MongoDB,
# memory) holds them alongside everything else. Needs Rust 1.88.
storage-drivers = ["dep:tinystoragedrivers-core", "dep:sha2", "dep:tokio"]

[dev-dependencies]
tinyflows = { path = "../tinyflows", features = ["store", "mock"] }
# The engine's `WorkflowStore` on an in-memory storage backend, for tests and
# the eval example.
tinyflows-drivers = { path = "../tinyflows-drivers", default-features = false, features = ["store"] }
tinystoragedrivers-core = { git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v0.7.0" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

