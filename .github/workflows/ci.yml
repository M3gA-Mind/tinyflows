name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job executes repo code (cargo build/test); don't persist the
          # token in git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the published crate carries no storage git dependency
        run: scripts/check-published-crate.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy the schedule-only drivers build
        run: cargo clippy -p tinyflows-drivers --all-targets --no-default-features --features schedule -- -D warnings

      - name: Clippy the schedule-only importer build
        run: cargo clippy -p tinyflows-import --all-targets --no-default-features --features schedule -- -D warnings

      - name: Clippy the schedule-read importer build
        run: cargo clippy -p tinyflows-import --all-targets --no-default-features --features schedule-read -- -D warnings

      - name: Check the schedule-read importer has no driver dependency
        run: |
          cargo check -p tinyflows-import --no-default-features --features schedule-read
          schedule_read_tree=$(cargo tree -p tinyflows-import --no-default-features --features schedule-read -e normal)
          if grep -q 'tinyflows-drivers' <<<"$schedule_read_tree"; then
            echo "schedule-read unexpectedly links tinyflows-drivers" >&2
            exit 1
          fi

      - name: Check the schedule importer enables its driver dependency
        run: |
          schedule_tree=$(cargo tree -p tinyflows-import --no-default-features --features schedule -e features)
          grep -q 'tinyflows-drivers feature "schedule"' <<<"$schedule_tree"

      - name: Build
        run: cargo build --all-targets

      - name: Build all features
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test

      - name: Test all features
        run: cargo test --all-features

      - name: Verify compiled workflow module
        run: bash scripts/verify-module-artifact.sh

      - name: Test the schedule-only drivers build
        # The cron store must build and pass without the engine.
        run: cargo test -p tinyflows-drivers --no-default-features --features schedule

      - name: Test the schedule-only importer build
        # Legacy cron jobs must import without the flows engine.
        run: cargo test -p tinyflows-import --no-default-features --features schedule

      - name: Test the schedule-read importer build
        # The bus DTO reader compiles without linking the scheduler or driver implementations.
        run: cargo test -p tinyflows-import --no-default-features --features schedule-read

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        # Unit tests live in *_tests.rs files, which cargo-llvm-cov excludes by
        # default. Include them to preserve the coverage gate's historical
        # semantics while still excluding dependencies, build output, and
        # standalone integration-test sources.
        run: >-
          cargo llvm-cov --all-features --workspace --summary-only
          --no-default-ignore-filename-regex
          --ignore-filename-regex
          '(/rustc/|/target/|/.cargo/(registry|git)/|/.rustup/toolchains/|/(tests|examples|benches)/)'
          --fail-under-lines 90
